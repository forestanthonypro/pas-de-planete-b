# Usage local / développement : docker compose up
# Les deux services (api, web) tournent sur une image Node générique et font
# npm install à chaque démarrage — pas besoin de rebuild ni d'exec manuel
# quand une dépendance est ajoutée, il suffit de relancer le service concerné.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      INGEST_TOKEN: ${INGEST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - api-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  notifications-worker:
    image: node:24-slim
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - api-node-modules:/app/node_modules
    command: sh -c "npm install && npm run push:worker"

  web:
    image: node:24-slim
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    command: sh -c "npm install && npm run dev"

volumes:
  postgres-data:
  api-node-modules:
  web-node-modules:
  web-next-cache:
