# Usage production : docker compose -f docker-compose.prod.yml up -d
# Les images sont construites en CI et poussées sur le registry, jamais buildées ici.
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirige systématiquement tout trafic HTTP (port 80) vers HTTPS —
      # sans ça, http://pasdeplaneteb.com reste servi en clair au lieu de
      # basculer automatiquement sur la version chiffrée.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=admin@pasdeplaneteb.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: ${REGISTRY}/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Sans ça, les réponses d'erreur de l'API exposent le détail technique
      # (message d'exception, parfois un fragment de requête SQL) à
      # n'importe quel visiteur — voir errorDetail() dans index.js.
      NODE_ENV: production
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.pasdeplaneteb.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.routers.api.middlewares=security-headers"
      # HSTS : demande au navigateur de toujours utiliser HTTPS pour ce
      # domaine pendant 6 mois (15552000s), y compris les sous-domaines —
      # même durée que celle déjà envoyée par Helmet côté API elle-même.
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"

  web:
    image: ${REGISTRY}/web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`pasdeplaneteb.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.routers.web.middlewares=security-headers"

  # --- Matomo (analytics auto-hébergé) ---
  # Base de données séparée de celle du site : Matomo exige MySQL/MariaDB,
  # incompatible avec le PostgreSQL/PostGIS déjà utilisé par l'API.
  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
    volumes:
      - matomo-db-data:/var/lib/mysql

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
    depends_on:
      - matomo-db
    volumes:
      - matomo-data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matomo.rule=Host(`stats.pasdeplaneteb.com`)"
      - "traefik.http.routers.matomo.entrypoints=websecure"
      - "traefik.http.routers.matomo.tls.certresolver=le"
      - "traefik.http.routers.matomo.middlewares=security-headers"

volumes:
  postgres-data:
  letsencrypt:
  matomo-db-data:
  matomo-data:
