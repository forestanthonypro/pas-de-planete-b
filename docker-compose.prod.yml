# Usage production : docker compose -f docker-compose.prod.yml up -d
# Les images sont construites en CI et poussées sur le registry, jamais buildées ici.
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirige systématiquement tout trafic HTTP (port 80) vers HTTPS —
      # sans ça, http://pasdeplaneteb.com reste servi en clair au lieu de
      # basculer automatiquement sur la version chiffrée.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=admin@pasdeplaneteb.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: ${REGISTRY}/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Sans ça, les réponses d'erreur de l'API exposent le détail technique
      # (message d'exception, parfois un fragment de requête SQL) à
      # n'importe quel visiteur — voir errorDetail() dans index.js.
      NODE_ENV: production
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.pasdeplaneteb.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.routers.api.middlewares=api-security-headers"
      # HSTS : demande au navigateur de toujours utiliser HTTPS pour ce
      # domaine pendant 6 mois (15552000s), y compris les sous-domaines —
      # même durée que celle déjà envoyée par Helmet côté API elle-même.
      - "traefik.http.middlewares.api-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.api-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.api-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.api-security-headers.headers.forceSTSHeader=true"

  notifications-worker:
    image: ${REGISTRY}/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    command: npm run push:worker
    depends_on:
      - postgres

  web:
    image: ${REGISTRY}/web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`pasdeplaneteb.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.routers.web.middlewares=web-security-headers"
      # Middleware défini directement sur ce service plutôt que réutilisé
      # depuis celui de l'API — Traefik ne rendait pas de façon fiable un
      # middleware défini sur un autre conteneur visible ici ("middleware
      # security-headers@docker does not exist" en boucle dans les logs,
      # jamais appliqué en pratique malgré l'absence d'erreur visible côté
      # utilisateur). Nom différent (web-security-headers) pour éviter toute
      # confusion avec celui de l'API, identique par ailleurs.
      - "traefik.http.middlewares.web-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.web-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.web-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.web-security-headers.headers.forceSTSHeader=true"
      # En-têtes ajoutés suite à un audit de sécurité externe (20 août 2026) :
      # seul HSTS était configuré jusque-là. Pas de Content-Security-Policy
      # ici — elle est générée par Next.js en mode Report-Only afin de
      # collecter les violations sans bloquer l'affichage. Voir
      # CSP_ROLLOUT.md avant toute activation en mode bloquant.
      - "traefik.http.middlewares.web-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.web-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.web-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.web-security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      # Redirection www -> domaine nu (repere via Google Search Console le
      # 9 aout 2026 : www.pasdeplaneteb.com renvoyait 404, aucune route
      # Traefik ne le couvrait). Redirection permanente plutot que de
      # servir le meme contenu sur les deux hotes, pour n'avoir qu'une
      # seule URL canonique cote moteurs de recherche.
      - "traefik.http.routers.web-www.rule=Host(`www.pasdeplaneteb.com`)"
      - "traefik.http.routers.web-www.entrypoints=websecure"
      - "traefik.http.routers.web-www.tls.certresolver=le"
      - "traefik.http.routers.web-www.tls.domains[0].main=www.pasdeplaneteb.com"
      - "traefik.http.routers.web-www.middlewares=web-www-redirect"
      - "traefik.http.middlewares.web-www-redirect.redirectregex.regex=^https://www\\.pasdeplaneteb\\.com/(.*)"
      - "traefik.http.middlewares.web-www-redirect.redirectregex.replacement=https://pasdeplaneteb.com/$1"
      - "traefik.http.middlewares.web-www-redirect.redirectregex.permanent=true"

  # --- Mini-jeu Éco-Ville : fichier HTML autonome, servi tel quel ---
  jeu:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./games/eco-ville:/usr/share/nginx/html:ro
      # Masque la version nginx dans l'en-tête Server (fuite d'info mineure,
      # relevée pendant l'audit du 21 août). Correction du 21 août : la
      # directive server_tokens n'est PAS autorisée en ligne de commande
      # (`nginx -g`), seulement dans un fichier de config chargé côté
      # `http {}` — la première tentative via `command:` faisait planter
      # nginx en boucle ("server_tokens directive is not allowed here in
      # command line"), d'où le 404 Traefik observé (plus personne à qui
      # router). Fichier minimal monté dans conf.d à la place.
      - ./games/nginx-server-tokens-off.conf:/etc/nginx/conf.d/server-tokens-off.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jeu.rule=Host(`jeu.pasdeplaneteb.com`)"
      - "traefik.http.routers.jeu.entrypoints=websecure"
      - "traefik.http.routers.jeu.tls.certresolver=le"
      - "traefik.http.routers.jeu.middlewares=jeu-security-headers"
      - "traefik.http.middlewares.jeu-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.jeu-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.jeu-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.jeu-security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.jeu-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.jeu-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.jeu-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.jeu-security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"

  # --- Matomo (analytics auto-hébergé) ---
  # Base de données séparée de celle du site : Matomo exige MySQL/MariaDB,
  # incompatible avec le PostgreSQL/PostGIS déjà utilisé par l'API.
  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
    volumes:
      - matomo-db-data:/var/lib/mysql

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
    depends_on:
      - matomo-db
    volumes:
      - matomo-data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matomo.rule=Host(`stats.pasdeplaneteb.com`)"
      - "traefik.http.routers.matomo.entrypoints=websecure"
      - "traefik.http.routers.matomo.tls.certresolver=le"
      - "traefik.http.routers.matomo.middlewares=matomo-security-headers"
      - "traefik.http.middlewares.matomo-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.matomo-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.matomo-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.matomo-security-headers.headers.forceSTSHeader=true"

volumes:
  postgres-data:
  letsencrypt:
  matomo-db-data:
  matomo-data:
