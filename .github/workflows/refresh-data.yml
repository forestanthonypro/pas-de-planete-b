name: Rafraîchir les données CO2

on:
  schedule:
    # Le 1er de chaque mois à 4h du matin UTC — OWID met à jour ses données annuellement,
    # une fréquence mensuelle suffit largement et reste sobre.
    - cron: "0 4 1 * *"
  workflow_dispatch: {}  # permet aussi de le déclencher manuellement depuis l'onglet Actions

jobs:
  refresh-co2:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'endpoint de ré-ingestion
        run: |
          curl -f -X POST "${{ secrets.API_URL }}/api/admin/ingest/co2" \
            -H "x-ingest-token: ${{ secrets.INGEST_TOKEN }}"
