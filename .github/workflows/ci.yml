name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package.json
      - run: npm install
        working-directory: apps/${{ matrix.app }}
      - run: npm run lint
        working-directory: apps/${{ matrix.app }}
      - run: npm test
        working-directory: apps/${{ matrix.app }}

  migration-sequence-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x db/migrate.sh && ./db/migrate.sh --check-sequence

  build-push:
    needs: [lint-test, migration-sequence-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          # Utilisé uniquement par apps/web (voir son Dockerfile) — ignoré
          # sans erreur pour apps/api, qui ne déclare pas cet ARG.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.pasdeplaneteb.com
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.app }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.app }}:${{ github.sha }}

  # Pas de serveur de staging distinct à ce jour (un seul VPS de production,
  # voir TODO.md) — job désactivé plutôt que de faire semblant de déployer
  # quelque part. À réactiver le jour où un vrai environnement de staging
  # existe, sur le même modèle que deploy-production ci-dessous.
  #
  # deploy-staging:
  #   needs: build-push
  #   runs-on: ubuntu-latest
  #   environment: staging
  #   steps:
  #     - name: Déployer sur le serveur de staging
  #       run: 'echo "TODO"'

  deploy-production:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déployer en production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ~/pas-de-planete-b
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            chmod +x db/migrate.sh
            ./db/migrate.sh docker-compose.prod.yml
            docker image prune -f
      - name: Vérifier qu'aucune migration n'est en attente
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ~/pas-de-planete-b
            ./db/migrate.sh docker-compose.prod.yml --check

  environmental-audit:
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer ecoindex-scraper et Chromium
        run: |
          pip install ecoindex-scraper --break-system-packages
          playwright install --with-deps chromium

      - name: Mesurer l'EcoIndex du site
        run: |
          python3 - << 'PYEOF' > ecoindex-result.json
          import asyncio, json
          from ecoindex.scraper import EcoindexScraper

          scraper = EcoindexScraper(url="${{ vars.PRODUCTION_URL || 'https://pasdeplaneteb.com' }}")
          result = asyncio.run(scraper.get_page_analysis())
          print(json.dumps({
              "grade": result.grade,
              "score": float(result.score),
              "size": float(result.size),
              "nodes": result.nodes,
              "requests": result.requests,
              "ges": float(result.ges),
              "water": float(result.water),
          }))

          # Diagnostic temporaire (chantier EcoIndex A->C du 15 août 2026) : le
          # détail requête par requête, pour identifier précisément ce qui
          # compose les ~84 requêtes mesurées — pas visible autrement. Écrit
          # dans un fichier séparé (pas dans ecoindex-result.json ci-dessus,
          # dont le format JSON strict est repris tel quel par jq plus loin
          # dans ce workflow). À retirer une fois le diagnostic terminé.
          all_requests = asyncio.run(scraper.get_all_requests())
          by_category = asyncio.run(scraper.get_requests_by_category())
          with open("ecoindex-requests-debug.json", "w") as f:
              json.dump({
                  "by_category": by_category.model_dump(),
                  "all_requests": [r.model_dump() for r in all_requests],
              }, f, indent=2)
          PYEOF
          cat ecoindex-result.json
          echo "--- Détail des requêtes (diagnostic) ---"
          cat ecoindex-requests-debug.json

      - name: Publier le détail des requêtes en artefact (diagnostic temporaire)
        uses: actions/upload-artifact@v7
        with:
          name: ecoindex-requests-debug
          path: ecoindex-requests-debug.json
          retention-days: 7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Mesurer les scores Lighthouse
        run: |
          npm install -g @lhci/cli@0.15.x
          # 3 runs plutôt qu'1 seul : un run unique sur un runner GitHub
          # Actions partagé varie facilement de ±10-15 points d'une exécution
          # à l'autre (charge CPU du runner, pas le site) — repéré le 30 août
          # 2026 après un saut Performance 65->49 sans changement de poids de
          # page correspondant. La médiane des 3 lisse ce bruit sans coût
          # significatif (le site ne change pas entre les runs).
          lhci collect --url="${{ vars.PRODUCTION_URL || 'https://pasdeplaneteb.com' }}" --numberOfRuns=3

      - name: Envoyer les résultats à l'API
        run: |
          # Médiane sur les 3 rapports plutôt que le premier venu (voir
          # commentaire ci-dessus) — jq trie les 3 valeurs et prend celle du
          # milieu pour chaque métrique séparément.
          median() { jq -s 'sort | .[1]'; }
          PERF=$(for f in .lighthouseci/lhr-*.json; do jq '(.categories.performance.score * 100) | round' "$f"; done | median)
          A11Y=$(for f in .lighthouseci/lhr-*.json; do jq '(.categories.accessibility.score * 100) | round' "$f"; done | median)
          SEO=$(for f in .lighthouseci/lhr-*.json; do jq '(.categories.seo.score * 100) | round' "$f"; done | median)
          BP=$(for f in .lighthouseci/lhr-*.json; do jq '(.categories["best-practices"].score * 100) | round' "$f"; done | median)
          LOAD_TIME=$(for f in .lighthouseci/lhr-*.json; do jq '.audits["speed-index"].numericValue | round' "$f"; done | median)
          ECOINDEX=$(cat ecoindex-result.json)

          PAYLOAD=$(jq -n \
            --argjson eco "$ECOINDEX" \
            --argjson perf "$PERF" --argjson a11y "$A11Y" --argjson seo "$SEO" --argjson bp "$BP" --argjson loadtime "$LOAD_TIME" \
            --arg url "${{ vars.PRODUCTION_URL || 'https://pasdeplaneteb.com' }}" \
            '{
              url: $url,
              ecoindexGrade: $eco.grade, ecoindexScore: $eco.score, pageWeightKb: $eco.size,
              domElements: $eco.nodes, requestsCount: $eco.requests, ghgCo2G: $eco.ges, waterCl: $eco.water,
              lighthousePerformance: $perf, lighthouseAccessibility: $a11y, lighthouseSeo: $seo, lighthouseBestPractices: $bp,
              loadTimeMs: $loadtime
            }')

          curl --fail --silent --show-error -X POST "${{ secrets.API_URL }}/api/admin/environmental-metrics" \
            -H "Content-Type: application/json" \
            -H "x-ingest-token: ${{ secrets.INGEST_TOKEN }}" \
            -d "$PAYLOAD"
