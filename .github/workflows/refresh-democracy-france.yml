name: Rafraîchir la démocratie France (Assemblée nationale)

on:
  schedule:
    # Quotidien (5h UTC), séparé de refresh-data.yml (mensuel) depuis le 11
    # octobre 2026 : en session parlementaire active, une cadence mensuelle
    # laissait jusqu'à ~1 mois de retard sur les scrutins (incident constaté
    # ce jour-là : 238 scrutins manquants). D'abord passé en hebdomadaire,
    # puis en quotidien le jour même pour que send-deputy-digests.yml (tous
    # les jours à 7h UTC, donc après celui-ci) parte toujours d'une base à
    # jour — un vote d'hier est au pire visible dans le digest du lendemain
    # matin, jamais après. Les groupes politiques et la liste des députés
    # changent rarement en cours de législature, mais sont réingérés ici
    # aussi par simplicité — le coût est négligeable (quelques secondes)
    # comparé à refresh-scrutins (2-3 min, ré-ingestion idempotente).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  # Ordre important : les députés doivent exister avant les votes (clé
  # étrangère), donc refresh-scrutins attend refresh-deputies.

  refresh-deputies:
    runs-on: ubuntu-latest
    steps:
      - name: Ré-ingérer la liste des députés
        run: |
          curl -f -X POST "${{ secrets.API_URL }}/api/admin/ingest/deputies" \
            -H "x-ingest-token: ${{ secrets.INGEST_TOKEN }}"

  refresh-an-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Ré-ingérer les groupes politiques
        run: |
          curl -f -X POST "${{ secrets.API_URL }}/api/admin/ingest/an-groups" \
            -H "x-ingest-token: ${{ secrets.INGEST_TOKEN }}"

  refresh-scrutins:
    needs: [refresh-deputies]
    runs-on: ubuntu-latest
    steps:
      - name: Ré-ingérer les scrutins et les votes détaillés (peut prendre plusieurs minutes)
        run: |
          curl -f -X POST "${{ secrets.API_URL }}/api/admin/ingest/scrutins" \
            -H "x-ingest-token: ${{ secrets.INGEST_TOKEN }}" \
            --max-time 1200
