name: Backfill historique — Stations météo de référence

# Contrairement au rafraîchissement annuel des températures (Open-Meteo,
# quota horaire strict), l'API Infoclimat ne limite pas le débit de façon
# stricte — seulement un "fair use" demandé, déjà respecté par le
# cadencement interne du script (DELAY_MS, ingest/referenceWeather.js).
# Pas besoin d'attendre entre les lots : ils s'enchaînent directement.
#
# La collecte n'a pas de date de fin figée : elle avance en continu depuis
# 1991 jusqu'à avant-hier (voir FRESHNESS_BUFFER_DAYS,
# ingest/referenceWeather.js), pas seulement jusqu'à 2020 — indispensable
# pour pouvoir comparer les jours récents aux normales 1991-2020 une fois
# celles-ci calculées. Une fois le rattrapage initial terminé (~35 ans),
# ce même workflow ne fait plus qu'1 jour de rattrapage par nuit — chaque
# exécution se termine alors en quelques secondes ("status":"caught-up").
#
# Volume du rattrapage initial : ~35 ans x ~52 tranches de 7 jours x 10
# stations ≈ 18 200 requêtes, cadencées à ~1,5s chacune ≈ 7-8h de travail
# réel. Chaque lot est borné à 10 minutes (voir la route), donc ~45-50 lots
# au total — répartis sur 2 à 3 exécutions quotidiennes de ce workflow
# avant rattrapage complet.
on:
  schedule:
    - cron: "0 2 * * *" # 2h UTC chaque jour
  workflow_dispatch: {}

jobs:
  ingest-reference-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # marge sous la limite de 6h de GitHub Actions
    steps:
      - name: Lots successifs jusqu'à complétion ou fin de fenêtre
        run: |
          for i in $(seq 1 30); do
            echo "=== Lot $i/30 ==="
            RESPONSE=$(curl -f -s -X POST "${{ secrets.API_URL }}/api/admin/ingest/reference-weather-batch" \
              -H "x-ingest-token: ${{ secrets.INGEST_TOKEN }}" \
              --max-time 660)
            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | grep -o '"status":"[a-z-]*"' | cut -d'"' -f4)
            if [ "$STATUS" = "caught-up" ]; then
              echo "Les 10 stations sont à jour jusqu'à avant-hier."
              exit 0
            fi
          done

          echo "30 lots traités pour aujourd'hui, il reste des données à récupérer — le cron de demain reprendra automatiquement."
