name: Audit de sécurité npm

on:
  schedule:
    # Chaque lundi à 6h UTC — indépendant du pipeline de déploiement,
    # purement informatif (n'empêche jamais un déploiement).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm audit --audit-level=high
