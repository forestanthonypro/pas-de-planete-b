version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react et react-dom doivent toujours rester à la même version —
      # une seule PR avec les deux mises à jour synchronisées, plutôt que
      # deux PR séparées à merger "ensemble" en espérant ne pas oublier
      # l'une des deux.
      react:
        patterns:
          - "react"
          - "react-dom"
      # Même logique : next et eslint-config-next évoluent en binôme
      # (eslint-config-next suit toujours la version de next).
      next:
        patterns:
          - "next"
          - "eslint-config-next"
    ignore:
      # ESLint 10 casse le lint ici : @typescript-eslint (embarqué par
      # eslint-config-next) n'implémente pas encore scopeManager.addGlobals,
      # une API que ESLint 10 exige désormais — bug connu côté écosystème
      # (voir typescript-eslint/typescript-eslint#11829/#11830), pas
      # quelque chose à corriger dans ce projet. L'équipe typescript-eslint
      # recommande elle-même de rester sur ESLint 9.x en attendant leur
      # correctif. Retirer cette règle une fois le correctif publié.
      - dependency-name: "eslint"
        versions: ["10.x"]

  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Les 3 paquets @capacitor/* doivent rester synchronisés entre eux.
      capacitor:
        patterns:
          - "@capacitor/*"

  # Garde aussi les actions GitHub elles-mêmes à jour (actions/checkout,
  # actions/setup-node, etc.) — souvent oublié, pourtant tout aussi
  # important que les dépendances npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
