version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

   - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # ESLint 10 casse le lint ici : @typescript-eslint (embarqué par
      # eslint-config-next) n'implémente pas encore scopeManager.addGlobals,
      # une API que ESLint 10 exige désormais — bug connu côté écosystème
      # (voir typescript-eslint/typescript-eslint#11829/#11830), pas
      # quelque chose à corriger dans ce projet. L'équipe typescript-eslint
      # recommande elle-même de rester sur ESLint 9.x en attendant leur
      # correctif. Retirer cette règle une fois le correctif publié.
      - dependency-name: "eslint"
        versions: ["10.x"]

  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Garde aussi les actions GitHub elles-mêmes à jour (actions/checkout,
  # actions/setup-node, etc.) — souvent oublié, pourtant tout aussi
  # important que les dépendances npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
